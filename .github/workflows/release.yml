name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: deep-world-tui-x86_64-linux
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact: deep-world-tui-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Windows cross-compiler
        if: contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Strip
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            x86_64-w64-mingw32-strip target/${{ matrix.target }}/release/deep-world-tui.exe
          else
            strip target/${{ matrix.target }}/release/deep-world-tui
          fi
      - name: Rename artifact
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            mv target/${{ matrix.target }}/release/deep-world-tui.exe ${{ matrix.artifact }}
          else
            mv target/${{ matrix.target }}/release/deep-world-tui ${{ matrix.artifact }}
          fi
      - name: Generate SHA256
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*