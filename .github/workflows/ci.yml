name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  playtest-smoke:
    name: playtest smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build playtest binary
        run: cargo build --bin playtest
      - name: Drive a scripted session and assert save/load survives
        run: |
          set -euo pipefail
          for seed in 42 555 777; do
            out=$(printf 'move e\nmove e\nmove e\ngather\nmove n\nencounter talk\nmove s\nmove w\nenter 0 0\nuse tavern\nexit\nsave\nload\nstatus\nquit\n' \
              | cargo run --quiet --bin playtest -- "$seed")
            echo "$out"
            if echo "$out" | grep -qiE 'Load failed|panicked|Save failed'; then
              echo "::error::playtest smoke failed for seed $seed"
              exit 1
            fi
          done

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilers
        if: contains(matrix.target, 'musl') || contains(matrix.target, 'windows')
        run: |
          sudo apt-get update
          if echo "${{ matrix.target }}" | grep -q musl; then
            sudo apt-get install -y musl-tools
          fi
          if echo "${{ matrix.target }}" | grep -q windows; then
            sudo apt-get install -y mingw-w64
          fi
      - run: cargo build --release --target ${{ matrix.target }}