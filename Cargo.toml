[package]
name = "deep-world-tui"
version = "0.1.0"
edition = "2021"
description = "A procedural life-RPG in the Deep World (Rust + ratatui)"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[features]
default = []
llm = ["reqwest"]

[dependencies.reqwest]
version = "0.12"
optional = true
features = ["blocking"]

[[bin]]
name = "deep-world-tui"
path = "src/main.rs"

[[bin]]
name = "playtest"
path = "src/bin/playtest.rs"

[lib]
name = "deep_world_tui"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
