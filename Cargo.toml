[workspace]
members = [".", "xtask"]

[package]
name = "deep-world-tui"
version = "1.0.0"
default-run = "deep-world-tui"
edition = "2021"
description = "A procedural life-RPG in the Deep World (Rust + ratatui)"
license = "MIT"
repository = "https://github.com/mtclab/deep-world-tui"
readme = "README.md"
keywords = ["roguelike", "tui", "ratatui", "simulation", "game"]
categories = ["games"]

[profile.release]
lto = "thin"

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
# Compact binary saves (entity-first epic, deep-world-godot#50): the world
# snapshot grows with materialized residents, so the save is bincode-encoded and
# gzip-compressed instead of verbose RON text. flate2 defaults to the pure-Rust
# miniz_oxide backend, so it cross-compiles to musl/windows without a C toolchain.
bincode = "1.3"
flate2 = "1"
# Parallel resident materialization (entity-first epic): generating one Person
# per soul across a province (up to ~120k) is embarrassingly parallel per
# settlement. Rayon remains native-only; wasm uses the identical sequential order.
gilrs = { version = "0.11.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
rayon = "1"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:clap"]
audio = ["hound"]
audio-playback = ["audio", "rodio"]
gamepad = ["tui", "dep:gilrs"]

[dependencies.hound]
version = "3.5"
optional = true

[dependencies.rodio]
version = "0.19"
optional = true

[[bin]]
name = "deep-world-tui"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "playtest"
path = "src/bin/playtest.rs"
required-features = ["tui"]

[[bin]]
name = "agent_bench"
path = "src/bin/agent_bench.rs"
required-features = ["tui"]

[lib]
name = "deep_world_tui"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
