[workspace]
members = [".", "xtask"]

[package]
name = "deep-world-tui"
version = "0.5.2"
default-run = "deep-world-tui"
edition = "2021"
description = "A procedural life-RPG in the Deep World (Rust + ratatui)"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
dirs = "6"

[features]
default = []
llm = ["reqwest", "serde_json"]
audio = ["hound"]
audio-playback = ["audio", "rodio"]

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "blocking", "rustls-tls"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.hound]
version = "3.5"
optional = true

[dependencies.rodio]
version = "0.19"
optional = true

[[bin]]
name = "deep-world-tui"
path = "src/main.rs"

[[bin]]
name = "playtest"
path = "src/bin/playtest.rs"

[lib]
name = "deep_world_tui"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
